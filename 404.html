<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>وصل</title>
<script>
// Short public links: /@name (a gold-star account) and /c/@name=code (a
// public channel; /c/@name for a verified one's clean name) open the link page with the same fragment. Nothing is sent
// anywhere: the name moves from the path into the #fragment, which the
// browser never sends to a server.
(function () {
  var p = location.pathname;
  try { p = decodeURIComponent(p); } catch (e) {}
  var m = p.match(/^\/(c\/)?@([^\/?#]{1,64})\/?$/);
  if (m) {
    // The channel handle's = is kept as is (`#c/@akhbar=7k2qmzt`).
    location.replace('/l/#' + (m[1] ? 'c/' : '') + '@' + encodeURIComponent(m[2]).replace(/%3D/gi, '='));
  } else {
    location.replace('/');
  }
})();
</script>
</head>
<body></body>
</html>
